# H5 站点的 nginx 配置
#
# 关键点：uni-app 的 H5 用 history 路由（manifest.json: h5.router.mode=history），
# 刷新 /posts/123 这类深链接时服务端必须回落到 index.html，否则直接 404。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传图片走接口域名，这里不代理，避免把静态站点变成开放代理
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的静态资源可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不能缓存：否则发版后用户一直拿到旧入口，引用着已删除的 chunk
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # history 路由回落
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查端点（容器健康检查用，不打日志）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
